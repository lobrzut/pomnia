# Pomnia Desktop Mini — the packaging half of the flavour split.
#
# The build was being assembled by hand each time, which is how a release goes
# out with the wrong `productName` or lands in `release/` on top of the full
# app's installer. It is a file now.
#
# Only the identity changes. Everything about *what* is packed comes from
# `electron-builder.yml` via `extends`, so a change to the file list reaches
# both builds and the two cannot drift apart.
#
# `appId` and `output` are separate on purpose. Mini and the full app must not
# share an install, a shortcut, or an output directory — and they already do not
# share `%APPDATA%`, because MAIN_VITE_POMNIA_FLAVOUR moves userData. Two
# programs writing one settings file is the failure this whole flavour split
# exists to avoid.
#
# Build with: npm run build:mini:win
extends: ./electron-builder.yml
appId: ai.pomnia.mini
productName: PomniaMini
directories:
  output: release/mini
# KNOWN: Mini still ships resources/brain-core, and cannot drop it here.
#
# Mini has no embedded Brain — MINI_ROUTES is connect/settings/skills/prompts/
# import with no Brain screen, and the main process forces brainTarget 'remote'
# when IS_MINI — yet it packs 25 MB of one, because the base config stages
# build/brain-core-runtime-v2 into resources/brain-core and `extends` reaches it.
#
# Declaring a shorter `extraResources` here does NOT help: electron-builder's
# `extends` **concatenates** arrays rather than replacing them. Tried, measured,
# reverted — the override only added duplicate tessdata and tray-icon entries
# while brain-core still arrived from the base.
#
# It is also not reproducible: `build:mini:win` never runs `stage:brain-core`, so
# what lands in the package is whatever a previous desktop build left in build/ —
# current after one, absent on a clean machine, stale from an older version in
# between. Deleting build/brain-core-runtime-v2 before packing does produce a
# Mini without it, which is how this was confirmed, but "the source happens not
# to exist" is the same non-determinism wearing a different hat.
#
# The real fix is to move the brain-core entry out of the shared base into a
# desktop-only config. That is five coordinated edits — base, a new desktop
# config, build:win / pack:mac / build:linux, and release-mac.yml, which calls
# `npx electron-builder --mac` with no --config and would otherwise silently
# ship a desktop with no embedded Brain. Not worth doing blind on a machine that
# cannot build macOS to check.
# Portable and zip, in that order.
#
# The portable exe was reported as "does not start", and it was measured as
# hanging: 90 seconds, nothing extracted, no child process, no window, no error.
# That reading was wrong. Measured again with counters rather than by looking
# for files, the launcher is working the whole time — CPU climbing 6s → 18s and
# 716 MB read by the 30-second mark — and the window comes up at about 40
# seconds. It is not blocked. It is silent, which is indistinguishable from
# broken when you are the one double-clicking it.
#
# So: make the wait shorter and make it visible.
#
# Measured, because the obvious knobs mostly did nothing:
#
#   compression: normal   No effect. For this target `normal` and `maximum`
#                         both produce 127 MB and both take ~66 s to unpack.
#   compression: store    Rejected on the numbers. It looked like a fix at
#                         first — one run came up in 22 s — but that was a warm
#                         file cache. Three clean runs: 49, 49, 55 s, against
#                         66-70 s for LZMA. A quarter off the wait, for a file
#                         5.3x larger (675 MB against 127 MB). Not a trade
#                         worth making, so the default stands.
#   unpackDirName         Gives the extraction a readable name in %TEMP%
#                         instead of a hash. It does *not* make a second launch
#                         faster — measured at 70 s, the same as the first, so
#                         the extractor runs every time either way.
#
# What the measurements actually say: the portable exe costs about a minute per
# launch on this machine, every launch, and no packaging option changes that by
# much — the extractor runs every time. So the zip is the artifact to reach for
# day to day: unpack it once, and every start after that is an ordinary exe
# start with no extractor at all. The portable exe stays for the case it is
# genuinely for — a machine you do not want to leave files on.
portable:
  unpackDirName: PomniaMini
win:
  target: [portable, zip]
  icon: resources/icon.ico
  executableName: PomniaMini
  publisherName: Pomnia
  artifactName: ${productName}-${version}-portable.${ext}
  requestedExecutionLevel: asInvoker
# Mini ships no installer, so the update feed the full app emits would describe
# an artifact nobody can install over.
publish: null
