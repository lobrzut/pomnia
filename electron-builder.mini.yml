# Pomnia Desktop Mini — the packaging half of the flavour split.
#
# The build was being assembled by hand each time, which is how a release goes
# out with the wrong `productName` or lands in `release/` on top of the full
# app's installer. It is a file now.
#
# Only the identity changes. Everything about *what* is packed comes from
# `electron-builder.yml` via `extends`, so a change to the file list reaches
# both builds and the two cannot drift apart.
#
# `appId` and `output` are separate on purpose. Mini and the full app must not
# share an install, a shortcut, or an output directory — and they already do not
# share `%APPDATA%`, because MAIN_VITE_POMNIA_FLAVOUR moves userData. Two
# programs writing one settings file is the failure this whole flavour split
# exists to avoid.
#
# Build with: npm run build:mini:win
extends: ./electron-builder.yml
appId: ai.pomnia.mini
productName: PomniaMini
directories:
  output: release/mini
# A zip, not electron-builder's `portable` target.
#
# `portable` wraps the app in an unsigned NSIS self-extractor, and on this
# machine that wrapper does not run: measured over 90 seconds it extracted
# nothing, started no child, printed nothing and returned no error — the
# launcher process simply sits there. The same build unpacked runs fine and
# opens its window, so the app is not the problem; the self-extractor is. An
# unsigned 127 MB self-extracting binary is exactly what Windows inspects
# hardest, and the packaging step had already warned "output file is locked for
# writing (maybe by virus scanner)".
#
# A zip has no extractor to be blocked. It is also more honestly portable:
# unpack it anywhere and run PomniaMini.exe. The target is passed on the command
# line too, because `extends` deep-merges this `win` block into the parent's and
# the parent's `target` survives — the first build produced an NSIS installer
# with "portable" in its filename that way.
win:
  target: [zip]
  icon: resources/icon.ico
  executableName: PomniaMini
  publisherName: Pomnia
  artifactName: ${productName}-${version}-portable.${ext}
  requestedExecutionLevel: asInvoker
# Mini ships no installer, so the update feed the full app emits would describe
# an artifact nobody can install over.
publish: null
