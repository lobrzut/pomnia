# Desktop packager. This is the file electron-builder loads when `--config` is
# omitted, so Windows, macOS, and Linux desktop packs keep embedding Brain.
#
# Mini must extend electron-builder.base.yml, not this file. `extraResources`
# is concatenated across `extends`; inheriting this file packs
# resources/brain-core into Mini even if Mini lists a shorter set.
extends: ./electron-builder.base.yml

# brain-core utilityProcess entry (embedded MCP) — JS + Electron-ABI natives; no second Electron EXE
extraResources:
  - from: build/brain-core-runtime-v2
    to: brain-core
    filter:
      - "**/*"
      - "!**/README*"
      - "!**/CHANGELOG*"
      - "!**/*.{map,md}"
      - "!**/test/**"
      - "!**/tests/**"
      - "!**/*.ts"

win:
  target: [nsis]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Pomnia
  uninstallDisplayName: Pomnia
  include: installer.nsh
  # Quit running app before replacing files (see installer.nsh customCheckAppRunning).
  deleteAppDataOnUninstall: false
