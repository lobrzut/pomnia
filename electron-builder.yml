# Pomnia desktop packager — keep metadata honest & AV-friendly (no fake signing).
# Windows Authenticode: set CSC_LINK + CSC_KEY_PASSWORD (see docs/CODE-SIGNING.md).
# Without a cert, builds stay unsigned; SmartScreen/Defender noise is expected.

appId: ai.pomnia.app
productName: Pomnia
copyright: Copyright © 2026 Pomnia
directories:
  output: release
  buildResources: resources
# Publishing target for the release assets. `--publish never` stays the default
# for local packs; this only tells electron-builder where a release lives so it
# emits latest.yml alongside the installer. That file carries the artifact's
# sha512 and is what makes the download verifiable — it was generated locally
# and never uploaded, so the checksum reached nobody.
publish:
  provider: github
  owner: lobrzut
  repo: pomnia
  releaseType: release
files:
  - out/**/*
  - resources/icon.ico
  - resources/icon.png
  - "!**/*.{map,md}"
  - "!**/*.bak*"
  # npm workspaces → junction/symlink; electron-builder skips them unless copied explicitly.
  # Main should bundle doc-parser + mammoth/unpdf/bluebird (electron.vite.config).
  # Safety net: still ship those packages into asar if any bare import remains.
  - from: packages/doc-parser
    to: node_modules/@pomnia/doc-parser
    filter:
      - package.json
      - dist/**/*
  - from: packages/brain-core
    to: node_modules/@pomnia/brain-core
    filter:
      - package.json
      - dist/**/*
  # Top-level bluebird (root dep) — required for residual subpath imports
  # like bluebird/js/release/promise from out/main.
  - from: node_modules/bluebird
    to: node_modules/bluebird
  - from: node_modules/mammoth
    to: node_modules/mammoth
  - from: node_modules/unpdf
    to: node_modules/unpdf
  # mammoth transitive deps (hoisted or nested) — cover residual requires
  - from: node_modules/@xmldom/xmldom
    to: node_modules/@xmldom/xmldom
  - from: node_modules/argparse
    to: node_modules/argparse
  - from: node_modules/base64-js
    to: node_modules/base64-js
  - from: node_modules/dingbat-to-unicode
    to: node_modules/dingbat-to-unicode
  - from: node_modules/jszip
    to: node_modules/jszip
  - from: node_modules/lop
    to: node_modules/lop
  - from: node_modules/path-is-absolute
    to: node_modules/path-is-absolute
  - from: node_modules/underscore
    to: node_modules/underscore
  - from: node_modules/xmlbuilder
    to: node_modules/xmlbuilder
  - from: node_modules/tesseract.js
    to: node_modules/tesseract.js
  - from: node_modules/tesseract.js-core
    to: node_modules/tesseract.js-core
  - from: node_modules/@napi-rs/canvas
    to: node_modules/@napi-rs/canvas
  - from: node_modules/pdfjs-dist
    to: node_modules/pdfjs-dist

asarUnpack:
  - "**/*.wasm"
  - "**/node_modules/@napi-rs/canvas/**/*"
  - "**/node_modules/tesseract.js-core/**/*"
# brain-core utilityProcess entry (embedded MCP) — JS + Electron-ABI natives; no second Electron EXE
extraResources:
  - from: build/brain-core-runtime-v2
    to: brain-core
    filter:
      - "**/*"
      - "!**/README*"
      - "!**/CHANGELOG*"
      - "!**/*.{map,md}"
      - "!**/test/**"
      - "!**/tests/**"
      - "!**/*.ts"
  - from: resources/tessdata
    to: tessdata
    filter:
      - "**/*"
      - "!**/.gitkeep"
win:
  target: [nsis]
  icon: resources/icon.ico
  executableName: Pomnia
  # Must match Authenticode certificate Subject CN when you sign.
  publisherName: Pomnia
  artifactName: ${productName}-${version}-setup.${ext}
  # Signing is automatic when CSC_LINK / WIN_CSC_LINK is set. Do not force-sign
  # without a cert (CI/local unsigned packs would fail).
  # forceCodeSigning: true
  # Optional local PFX (prefer CSC_LINK env — never commit certs):
  # certificateFile: C:\\secure\\pomnia-codesign.pfx
  # certificatePassword: ${env.CSC_KEY_PASSWORD}
  requestedExecutionLevel: asInvoker
  # No fileAssociations — avoids extra shell/AV surface for a vault app.
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Pomnia
  uninstallDisplayName: Pomnia
  include: installer.nsh
  # Quit running app before replacing files (see installer.nsh customCheckAppRunning).
  deleteAppDataOnUninstall: false
mac:
  target: [dmg]
  category: public.app-category.utilities
  artifactName: ${productName}-${version}.${ext}
# Linux: build on Linux (or ubuntu-latest CI). AppImage needs Linux host —
# Windows cannot cross-produce a working AppImage with native better-sqlite3.
linux:
  target:
    - AppImage
    - deb
  category: Utility
  icon: resources/icon.png
  executableName: Pomnia
  artifactName: ${productName}-${version}.${ext}
  synopsis: Local-first AI memory — encrypted vault, MCP-native Brain
  description: >-
    Pomnia — one encrypted memory your AI agents share. Local-first,
    MCP-native: encrypted vault, distill pipeline, embedded Brain.
  desktop:
    Name: Pomnia
    Comment: Local-first AI memory
    Categories: Utility;
    StartupWMClass: Pomnia

