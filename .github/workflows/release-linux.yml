name: Release Linux (AppImage + deb)

# Fastest path to a downloadable Linux desktop build from a Windows-only
# machine: dispatch this workflow, then attach artifacts to the GH Release
# (npm run attach:linux-release, or the tag upload step below).

on:
  workflow_dispatch:
  push:
    branches:
      # Until this workflow lands on the default branch, workflow_dispatch 404s.
      # Branch pushes still run the workflow file from this commit.
      - fix/machine-move-honesty
      - master
      - main
    tags:
      - 'v*'

jobs:
  lint-posix-install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: POSIX syntax (dash)
        run: |
          sh -n packages/brain-core/deploy/bootstrap.sh
          sh -n packages/brain-core/deploy/install-remote.sh
      - name: shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck -s sh packages/brain-core/deploy/bootstrap.sh

  build-linux:
    runs-on: ubuntu-latest
    needs: lint-posix-install
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux pack tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            python3 \
            rpm \
            fakeroot \
            dpkg \
            libfuse2

      - name: Build workspace packages
        run: npm run build:brain-core && npm run build:doc-parser

      - name: Run tests
        run: npm test

      - name: Build Linux AppImage + deb
        run: |
          rm -rf release/linux-unpacked release/*.AppImage release/*.deb release/latest-linux.yml || true
          npm run pack:linux
        env:
          # CI runners have no operator vault — skip the local memory gate.
          GOLDEN_PATH_SKIP: '1'
          # Honest unsigned build (same stance as Windows/macOS early public).
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Avoid EEXIST hardlink collisions when canvas is listed both as an
          # explicit files: copy and as a resolved dependency (Linux CI).
          USE_HARD_LINKS: 'false'

      # The server had no artifact at all. .AppImage and .deb are the desktop
      # app — someone who wants the self-hosted brain had to clone the repo,
      # install Node and npm, and build it. That is a high bar for the audience
      # the whole thing is aimed at, and nothing on the releases page said the
      # downloads were the desktop rather than the server.
      #
      # This is the shape install.sh already expects: dist/, package.json,
      # deploy/, and node_modules alongside them. remote-upgrade.sh has assumed
      # a tarball of exactly this since it was written.
      - name: Pack brain-core server
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./packages/brain-core/package.json').version")
          STAGE=$(mktemp -d)/pomnia-brain-core
          mkdir -p "$STAGE"

          cp -r packages/brain-core/dist packages/brain-core/package.json "$STAGE/"
          cp -r packages/brain-core/deploy "$STAGE/"

          # Production dependencies only, native modules built against this
          # runner's Node — which is why this is packed on Linux and not on the
          # Windows box the desktop is built on.
          npm ci --omit=dev --workspace @pomnia/brain-core --include-workspace-root=false
          cp -r node_modules "$STAGE/"

          TARBALL="release/pomnia-brain-core-${VERSION}-linux-x64.tar.gz"
          mkdir -p release
          tar -czf "$TARBALL" -C "$(dirname "$STAGE")" pomnia-brain-core
          echo "packed $TARBALL ($(du -h "$TARBALL" | cut -f1))"

          # Prove the archive is usable rather than merely produced. Never by
          # starting the daemon: it has no --version, so `daemon.js --version`
          # does not print and exit — it boots a server and runs forever, which
          # is how this step first hung a CI job for two and a half hours.
          #
          # Load the entry point instead. Importing it resolves every dependency
          # the archive claims to carry, so a missing or wrong-ABI native module
          # fails here rather than on someone's machine, and nothing binds a port.
          VERIFY=$(mktemp -d)
          tar -xzf "$TARBALL" -C "$VERIFY"
          U="$VERIFY/pomnia-brain-core"

          node -e "
            const { readFileSync } = require('node:fs')
            const v = JSON.parse(readFileSync('$U/package.json','utf8')).version
            if (v !== '$VERSION') { console.error('version mismatch: ' + v); process.exit(1) }
            console.log('version in archive: ' + v)
          "
          NODE_PATH="$U/node_modules" node -e "
            require('$U/node_modules/better-sqlite3')
            console.log('native module loads from the archive')
          "
          test -f "$U/deploy/install.sh" || { echo 'no deploy/install.sh' >&2; exit 1; }
          test -f "$U/deploy/bootstrap.sh" || { echo 'no deploy/bootstrap.sh' >&2; exit 1; }
          sh -n "$U/deploy/bootstrap.sh"
          test -f "$U/deploy/pomnia-brain-core.service" || { echo 'no unit file' >&2; exit 1; }
          test -f "$U/dist/daemon.js" || { echo 'no daemon.js' >&2; exit 1; }
          echo "tarball unpacks, resolves its native deps, and carries the deploy files"

      - name: SHA-256 checksums
        run: |
          cd release
          for f in *.AppImage *.deb *.tar.gz; do
            [ -f "$f" ] || continue
            sha256sum "$f" | tee "${f}.sha256"
          done
          ls -lah *.AppImage *.deb *.tar.gz *.sha256 2>/dev/null || true

      - name: Upload Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pomnia-linux
          path: |
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
            release/*.sha256
            release/latest-linux.yml
          if-no-files-found: error

      - name: Attach to GitHub Release (tag pushes)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          shopt -s nullglob
          ASSETS=(release/*.AppImage release/*.deb release/*.tar.gz release/*.sha256)
          if [ -f release/latest-linux.yml ]; then
            ASSETS+=(release/latest-linux.yml)
          fi
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "No Linux packages to upload"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Existing release (often Windows-first): upload only — do not flip draft/published.
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            echo "Attached Linux assets to existing $TAG"
          else
            # No release yet — create draft; Windows publish:release owns going live.
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "Pomnia ${TAG#v}" \
              --notes "Linux desktop app (AppImage/deb, unsigned) and the self-hosted server tarball (pomnia-brain-core-*-linux-x64.tar.gz). Windows installer may follow via publish:release." \
              --draft
            echo "Created draft release $TAG with Linux assets"
          fi
