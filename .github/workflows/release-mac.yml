name: Release macOS (DMG)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Linux job has always had this and macOS never did, which is the
      # whole reason no DMG exists. The test suite imports @pomnia/brain-core
      # and @pomnia/doc-parser, so without their dist/ the run dies on "Failed
      # to resolve entry for package" — seven failures, under a minute, on every
      # tag since v0.1.61. A job that fails identically every time stops being
      # read, which is how three releases shipped without the platform anybody
      # noticed was missing.
      - name: Build workspace packages
        run: npm run build:brain-core && npm run build:doc-parser

      - name: Run tests
        run: npm test

      # pack:mac does these before it packs; building electron-builder
      # directly means doing them here or shipping an app without the bundled
      # brain-core and tessdata it expects at runtime.
      - name: Stage bundled resources
        run: npm run stage:brain-core && npm run stage:tessdata && npm run generate:build-info

      # One invocation per architecture, not one that emits both.
      #
      # electron-builder stages the app once and copies it per target, so
      # building x64 and arm64 together on an Apple Silicon runner puts arm64
      # .node files inside the Intel app. That app opens, draws its window, and
      # dies on the first SQLite query with "have 'arm64', need 'x86_64'" —
      # verified on a real Intel Mac against the v0.1.63 artefact, which is why
      # both DMGs were pulled from that release.
      - name: Build macOS DMG (arm64)
        run: npx electron-vite build && npx electron-builder --mac --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          USE_HARD_LINKS: 'false'

      - name: Build macOS DMG (x64)
        run: npx electron-builder --mac --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          USE_HARD_LINKS: 'false'

      # The counter that has to move. A DMG carrying the wrong architecture is
      # indistinguishable from a good one until someone opens it and runs a
      # query, so this asks the binaries what they are instead of trusting the
      # build that produced them. Failing here is the point: a broken DMG that
      # never reaches a release costs a rerun, and one that does costs trust.
      - name: Verify native modules match their architecture
        run: |
          set -euo pipefail
          fail=0
          for arch in arm64 x64; do
            case "$arch" in
              arm64) want='arm64'  ; dir='release/mac-arm64' ;;
              x64)   want='x86_64' ; dir='release/mac' ;;
            esac
            [ -d "$dir" ] || dir="release/mac-$arch"
            app="$dir/Pomnia.app"
            if [ ! -d "$app" ]; then
              echo "::error::no .app for $arch (looked in $dir)"
              ls -la release/ || true
              fail=1
              continue
            fi
            echo "-- $arch expects $want, checking $app"
            found=0
            while IFS= read -r bin; do
              found=1
              got=$(file -b "$bin" || echo unknown)
              case "$got" in
                *"$want"*) echo "   ok    $(basename "$bin")" ;;
                *)         echo "   WRONG $(basename "$bin"): $got" ; fail=1 ;;
              esac
            done < <(find "$app" \( -name '*.node' -o -name '*.dylib' \) | head -40)
            if [ "$found" = 0 ]; then
              echo "::error::no native modules found in $app — packaging changed"
              fail=1
            fi
          done
          if [ "$fail" != 0 ]; then
            echo "::error::a DMG carries native modules for the wrong architecture"
            exit 1
          fi
          echo "every native module matches its target architecture"

      - name: SHA-256 checksum
        run: |
          set -euo pipefail
          cd release
          for f in *.dmg; do
            [ -f "$f" ] || continue
            shasum -a 256 "$f" | tee "${f}.sha256"
          done
          ls -lah *.dmg *.sha256 2>/dev/null || true

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: pomnia-macos-dmg
          path: |
            release/*.dmg
            release/*.sha256
          if-no-files-found: error

      # Uploading to Actions only meant the DMG existed somewhere nobody
      # downloads from. The release page is where every link on pomnia.ai
      # points, so that is where it has to land.
      - name: Attach to GitHub Release (tag pushes)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          shopt -s nullglob
          ASSETS=(release/*.dmg release/*.sha256)
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "No DMG to upload" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            echo "Attached macOS assets to $TAG"
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "Pomnia ${TAG#v}" \
              --notes "macOS DMG (unsigned)." \
              --draft
            echo "Created draft release $TAG with the macOS DMG"
          fi
