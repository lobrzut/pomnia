name: Release macOS (DMG)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-mac:
    # One runner per architecture, each building only its own.
    #
    # Cross-compiling does not work here and cannot be made to. sqlite-vec and
    # @napi-rs/canvas ship per-platform optional dependencies, so `npm ci` on an
    # Apple Silicon runner installs darwin-arm64 and nothing else — there is no
    # x64 binary on the machine to package. Splitting electron-builder into two
    # invocations changed nothing, because the missing piece was never in
    # node_modules to begin with; the check below caught it saying
    # "have 'arm64', need 'x86_64'" on a file called skia.darwin-arm64.node,
    # which names the whole problem.
    #
    # macos-13 is the last Intel image GitHub offers. When it goes, the honest
    # options are dropping Intel or renting a builder — not cross-compiling and
    # hoping.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            arch: x64
            expect: x86_64
          - runner: macos-latest
            arch: arm64
            expect: arm64
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.arch }} on ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Linux job has always had this and macOS never did, which is the
      # whole reason no DMG exists. The test suite imports @pomnia/brain-core
      # and @pomnia/doc-parser, so without their dist/ the run dies on "Failed
      # to resolve entry for package" — seven failures, under a minute, on every
      # tag since v0.1.61. A job that fails identically every time stops being
      # read, which is how three releases shipped without the platform anybody
      # noticed was missing.
      - name: Build workspace packages
        run: npm run build:brain-core && npm run build:doc-parser

      - name: Run tests
        run: npm test

      # pack:mac does these before it packs; building electron-builder
      # directly means doing them here or shipping an app without the bundled
      # brain-core and tessdata it expects at runtime.
      - name: Stage bundled resources
        run: npm run stage:brain-core && npm run stage:tessdata && npm run generate:build-info

      - name: Build macOS DMG (${{ matrix.arch }})
        run: npx electron-vite build && npx electron-builder --mac --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          USE_HARD_LINKS: 'false'

      # The counter that has to move. A DMG carrying the wrong architecture is
      # indistinguishable from a good one until someone opens it and runs a
      # query — the v0.1.63 x64 build launched, drew its window, and died on the
      # first SQLite call. This asks the binaries what they are instead of
      # trusting the build that produced them.
      - name: Verify native modules are ${{ matrix.expect }}
        run: |
          set -euo pipefail
          app=$(find release -maxdepth 2 -name 'Pomnia.app' -type d | head -1)
          [ -n "$app" ] || { echo "::error::no Pomnia.app under release/"; ls -la release/ || true; exit 1; }
          echo "checking $app for ${{ matrix.expect }}"
          fail=0
          found=0
          while IFS= read -r bin; do
            found=1
            got=$(file -b "$bin" || echo unknown)
            case "$got" in
              *'${{ matrix.expect }}'*) echo "   ok    $(basename "$bin")" ;;
              *)                        echo "   WRONG $(basename "$bin"): $got" ; fail=1 ;;
            esac
          done < <(find "$app" \( -name '*.node' -o -name '*.dylib' \) | head -40)
          [ "$found" = 1 ] || { echo "::error::no native modules found in $app"; exit 1; }
          [ "$fail" = 0 ] || { echo "::error::built for ${{ matrix.arch }} but carries foreign binaries"; exit 1; }
          echo "all native modules are ${{ matrix.expect }}"

      - name: SHA-256 checksum
        run: |
          set -euo pipefail
          cd release
          for f in *.dmg; do
            [ -f "$f" ] || continue
            shasum -a 256 "$f" | tee "${f}.sha256"
          done
          ls -lah *.dmg *.sha256 2>/dev/null || true

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: pomnia-macos-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.sha256
          if-no-files-found: error

      # Uploading to Actions only meant the DMG existed somewhere nobody
      # downloads from. The release page is where every link on pomnia.ai
      # points, so that is where it has to land.
      - name: Attach to GitHub Release (tag pushes)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          shopt -s nullglob
          ASSETS=(release/*.dmg release/*.sha256)
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "No DMG to upload" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            echo "Attached macOS assets to $TAG"
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "Pomnia ${TAG#v}" \
              --notes "macOS DMG (unsigned)." \
              --draft
            echo "Created draft release $TAG with the macOS DMG"
          fi
